policy:
  id: claude_sdk_repo
  name: Claude Agent SDK repository configuration
  category: claude_sdk
  description: >
    Repo-scoped rules for Claude Agent SDK project-wide configuration declared
    in .claude/settings.json (and settings.local.json) and in session
    configuration objects (ClaudeAgentOptions).

rules:
  - id: CSDK-201
    title: Project default permission mode bypasses approvals
    severity: high
    confidence: 0.9
    applies_to:
      - claude_sdk
    scope: repo
    match:
      repo_claude_default_mode_is:
        - bypassPermissions
    explanation: >
      The project's .claude/settings.json sets defaultMode to
      "bypassPermissions", which disables Claude Code's permission prompts for
      the whole repo. Every tool the agent can reach then runs with no human
      approval step — file writes, shell commands, and network fetches all
      execute unprompted. A single prompt-injection or a model mistake becomes
      an unguarded action on the developer's machine, and the setting applies to
      everyone who checks the repo out, not just the author.
    fix: >
      Remove the "defaultMode": "bypassPermissions" entry from
      .claude/settings.json (and settings.local.json), or change it to
      "default" so tool calls prompt, or "acceptEdits" if you only want to
      auto-approve file edits while still gating shell and network actions.
      Reserve bypassPermissions for disposable sandboxes, never a shared repo.

  - id: CSDK-202
    title: Session permission mode bypasses approvals
    severity: high
    confidence: 0.9
    applies_to:
      - claude_sdk
    scope: repo
    match:
      repo_claude_options_permission_mode_is:
        - bypassPermissions
    explanation: >
      A ClaudeAgentOptions(...) in this project sets permission_mode to
      "bypassPermissions", which turns off Claude Code's approval prompts for
      that session. Every tool the agent can call — file writes, shell
      commands, network fetches — then runs with no human in the loop, so a
      single prompt-injection or model error becomes an unguarded action. This
      is the in-code, session-level form of the settings.json defaultMode
      bypass (CSDK-201), and is where most applications actually enable it.
    fix: >
      Drop permission_mode="bypassPermissions" from the ClaudeAgentOptions(...)
      call, or set it to "default" so tool calls prompt (or "acceptEdits" to
      auto-approve only file edits while still gating shell and network access).
      Reserve bypassPermissions for disposable sandboxes, never code that runs
      on a developer's or user's machine.

  - id: CSDK-204
    title: Claude Agent SDK session sets no explicit max_turns limit
    severity: low
    confidence: 0.6
    applies_to:
      - claude_sdk
    scope: repo
    match:
      repo_claude_options_max_turns_missing: true
    explanation: >
      No ClaudeAgentOptions(...) in this project sets max_turns, so the agent
      loop runs to whatever ceiling the runtime applies by default rather than
      to a bound sized for this task. A model that loops or oscillates —
      retrying a failing tool, re-reading the same file, ping-ponging between
      two steps — keeps consuming turns, tokens, and tool side effects until
      that implicit ceiling is reached, and an implicit ceiling can shift
      between SDK versions without any change on your side. An explicit cap
      also turns a stuck run into a clean, observable stop instead of a slow
      burn.
    fix: >
      Pass max_turns= to ClaudeAgentOptions(...), sized to the work the
      session actually does — a handful of turns for a single-file edit, more
      for a multi-step investigation. Treat hitting the cap as a signal to
      surface and handle rather than to raise it: if a task legitimately
      needs many turns, split it into bounded sub-sessions instead of
      removing the bound.

  - id: CSDK-205
    title: Claude Agent SDK session auto-approves edits with no tool deny-list
    severity: medium
    confidence: 0.7
    applies_to:
      - claude_sdk
    scope: repo
    match:
      all:
        - repo_claude_options_permission_mode_is:
            - acceptEdits
        - repo_claude_options_disallowed_tools_missing: true
    explanation: >
      A ClaudeAgentOptions(...) in this project sets permission_mode to
      "acceptEdits", which auto-approves file writes and edits without a
      prompt, and no construction in the project sets disallowed_tools. Claude
      SDK's allowed_tools only auto-approves listed tools — it does not
      restrict which tools can run, so an unlisted tool still executes,
      falling back to whatever the current permission_mode allows. With
      acceptEdits already removing the approval step for Write/Edit and no
      deny-list to bound the rest of the tool surface, a prompt-injected or
      mistaken model action can reach shell commands, network fetches, or any
      other tool the session can see, with nothing short of a human noticing
      to stop it.
    fix: >
      Pass disallowed_tools= to ClaudeAgentOptions(...), naming the tools this
      session must never call — at minimum shell execution and any tool that
      reaches the network or credentials. Keep acceptEdits if auto-approving
      file edits is intentional, but pair it with an explicit deny-list so the
      rest of the tool surface stays gated, or drop back to permission_mode
      "default" if edits should prompt too.
